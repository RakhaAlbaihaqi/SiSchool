<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Data Guru — SiSchool</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: Arial, sans-serif; background:#fff; color:#1a1a2e; font-size:13px; }
  .header { background: linear-gradient(135deg,#4c1d95,#7c3aed); color:#fff; padding:28px 32px; }
  .header h1 { font-size:22px; font-weight:700; }
  .header p  { font-size:12px; opacity:.8; margin-top:6px; }
  .meta { display:flex; justify-content:space-between; padding:12px 32px; background:#f5f3ff; border-bottom:1px solid #ddd6fe; font-size:12px; color:#555; }
  .content { padding:24px 32px; }
  .summary { display:flex; gap:16px; margin-bottom:20px; }
  .sum-card { flex:1; background:#f5f3ff; border:1px solid #ddd6fe; border-radius:10px; padding:14px 18px; text-align:center; }
  .sum-card .val { font-size:24px; font-weight:700; color:#4c1d95; }
  .sum-card .lbl { font-size:10px; color:#888; text-transform:uppercase; letter-spacing:.5px; margin-top:4px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th { background:#4c1d95; color:#fff; padding:10px 12px; text-align:left; font-size:11px; letter-spacing:.4px; text-transform:uppercase; }
  td { padding:9px 12px; border-bottom:1px solid #ede9fe; }
  tr:nth-child(even) td { background:#faf5ff; }
  .footer { margin-top:24px; text-align:right; font-size:11px; color:#999; border-top:1px solid #ede9fe; padding-top:10px; }
  .print-btn { position:fixed; bottom:24px; right:24px; background:#7c3aed; color:#fff; border:none; padding:12px 24px; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; box-shadow:0 8px 24px rgba(124,58,237,.3); }
  @media print { .print-btn { display:none; } body { -webkit-print-color-adjust:exact; print-color-adjust:exact; } }
</style>
</head>
<body>
<div class="header">
  <h1>🎓 Data Guru — SiSchool</h1>
  <p>Sistem Pengolahan Nilai Siswa</p>
</div>
<div class="meta">
  <span>Total: <strong>{{ data|length }} guru</strong></span>
  <span id="tgl"></span>
</div>
<div class="content">
  <div class="summary">
    <div class="sum-card"><div class="val">{{ data|length }}</div><div class="lbl">Total Guru</div></div>
  </div>
  <table>
    <thead>
      <tr><th>No</th><th>ID Guru</th><th>Nama Guru</th><th>Username</th></tr>
    </thead>
    <tbody>
      {% for g in data %}
      <tr>
        <td>{{ loop.index }}</td>
        <td style="font-family:monospace;font-size:11px;color:#7c3aed;font-weight:700;">{{ g.id_guru }}</td>
        <td style="font-weight:600;">{{ g.nama_guru }}</td>
        <td style="color:#666;">{{ g.username }}</td>
      </tr>
      {% else %}
      <tr><td colspan="4" style="text-align:center;padding:24px;color:#999;">Tidak ada data.</td></tr>
      {% endfor %}
    </tbody>
  </table>
  <div class="footer">Dicetak melalui SiSchool &bull; <span id="tgl2"></span></div>
</div>
<button class="print-btn" onclick="window.print()">🖨️ Cetak / Simpan PDF</button>
<script>
  const now = new Date().toLocaleString('id-ID',{dateStyle:'long',timeStyle:'short'});
  document.getElementById('tgl').textContent = 'Dicetak: ' + now;
  document.getElementById('tgl2').textContent = now;
</script>
</body>
</html>

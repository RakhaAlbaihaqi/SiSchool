{% extends 'base.html' %}
{% block title %}Tambah Mata Pelajaran{% endblock %}
{% block page_title %}Tambah Mata Pelajaran{% endblock %}
{% block page_sub %}Daftarkan mata pelajaran baru{% endblock %}

{% block content %}
<div class="card" style="max-width:420px;">
    <div class="card-header"><span class="card-title">Form Mata Pelajaran</span></div>
    <div class="card-body">
        <form method="POST">
            <div class="form-group">
                <label>ID Mata Pelajaran</label>
                <input type="text" name="id_mapel" placeholder="Contoh: MTK, IPA, BIN" required>
            </div>
            <div class="form-group">
                <label>Nama Mata Pelajaran</label>
                <input type="text" name="nama_mapel" placeholder="Contoh: Matematika" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">💾 Simpan</button>
                <a href="{{ url_for('list_mapel') }}" class="btn btn-secondary">✕ Batal</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
